[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:_Backend"

[project]
name = "sprint_n"
version = "1.0.0"
description = "Selenium UI tests for Яндекс.Маршруты (qa-routes)"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.20",
    "pytest>=8.0",
    "allure-pytest>=2.13.2",
    "faker>=25.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --alluredir=allure-results --clean-alluredir"
log_cli = true
log_cli_level = "ERROR"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["pages", "locators", "data", "test", "conftest.py"]
extend-exclude = [".opencode", ".git", "allure-results"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["UP031"]  # printf-форматирование % намеренно для вставки JS-сниппетов

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true
